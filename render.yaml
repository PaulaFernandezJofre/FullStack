# =============================================================================
# Render Blueprint - LogicPerfect
# =============================================================================
# Deploy to Render.com with PostgreSQL
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: logicperfect
    env: python
    region: oregon
    plan: free
    
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    
    startCommand: gunicorn devstack.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: logicperfect-db
          property: connectionString
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: SITE_URL
        sync: false

databases:
  - name: logicperfect-db
    plan: free
    databaseName: logicperfect
    ipAllowList: []
