{% extends 'base.html' %}
{% load static %}

{% block title %}Panel de Vendedor{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <aside class="col-lg-2 col-md-3 mb-4 mb-md-0">
            <div class="list-group shadow-sm">
                <a href="{% url 'sellers:dashboard' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
                <a href="{% url 'products:my-products' %}" class="list-group-item list-group-item-action {% if 'my-products' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-box-seam me-2"></i>Mis Productos
                </a>
                <a href="{% url 'sellers:add-product' %}" class="list-group-item list-group-item-action {% if 'add-product' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-plus-circle me-2"></i>Agregar Producto
                </a>
                <a href="{% url 'orders:seller-orders' %}" class="list-group-item list-group-item-action {% if 'seller-orders' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-receipt me-2"></i>Ventas
                </a>
                <a href="{% url 'payments:earnings' %}" class="list-group-item list-group-item-action {% if 'earnings' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-currency-dollar me-2"></i>Ganancias
                </a>
                <a href="{% url 'payments:payouts' %}" class="list-group-item list-group-item-action {% if 'payouts' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-wallet2 me-2"></i>Retiros
                </a>
                <a href="{% url 'support:tickets' %}" class="list-group-item list-group-item-action {% if 'tickets' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-headset me-2"></i>Soporte
                </a>
                <a href="{% url 'users:profile' %}" class="list-group-item list-group-item-action {% if 'profile' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-gear me-2"></i>Configuración
                </a>
            </div>
        </aside>

        <main class="col-lg-10 col-md-9">
            {% block seller_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
